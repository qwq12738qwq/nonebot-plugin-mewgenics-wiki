name: pypi-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          V="${INPUT_VERSION:-${TAG_NAME#v}}"
          export V
          python - <<'EOF'
          import os, re, tomllib, sys
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["V"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-zA-Z0-9.+-]*)?", tag):
              sys.exit(f"invalid version: {tag}")
          if version != tag:
              sys.exit(f"tag/version mismatch: tag={tag} project={version}")
          EOF

      - run: pip install build twine
      - run: python -m build --wheel
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    name: test (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: python -m pip install --upgrade pip
      - run: pip install dist/*.whl pytest

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run installed wheel tests
        env:
          RENDER__PROVIDER_CONFIG__STORAGE_PATH: /home/runner/.cache/ms-playwright
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests"

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi_upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
